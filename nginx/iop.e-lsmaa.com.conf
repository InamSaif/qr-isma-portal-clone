# Same vhost pattern as base IOP.
# DNS: A record named `iop` on e-lsmaa.com -> this server
# App: Docker host port 3017 (base IOP used 3007)
#
# Install:
#   sudo cp nginx/iop.e-lsmaa.com.conf /etc/nginx/sites-available/qr-isma-portal
#   sudo ln -sf /etc/nginx/sites-available/qr-isma-portal /etc/nginx/sites-enabled/qr-isma-portal
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name iop.e-lsmaa.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iop.e-lsmaa.com;

    ssl_certificate /etc/letsencrypt/live/iop.e-lsmaa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iop.e-lsmaa.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
